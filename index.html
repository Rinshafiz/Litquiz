function parse(t){
 return t.split(/\n\s*\n/).map(b=>{
  const L=b.split('\n').map(l=>l.trim()).filter(Boolean);
  let q=[],o=[],a=null;
  L.forEach(l=>{let m;
   if(m=l.match(/^(?:answer|ans)\s*[:\-]?\s*(.+)/i))a=(m[1].match(/[A-Da-d]/g)||[]).map(c=>'ABCD'.indexOf(c.toUpperCase()));
   else if(m=l.match(/^\(?([A-Da-d])[\).]\s*(.+)/))o.push(m[2]);
   else if(!o.length)q.push(l.replace(/^\d+[\).]\s*/,''));});
  return {q:q.join(' '),o,a};
 }).filter(x=>x.q&&x.o.length>=2&&x.a&&x.a.length&&x.a.every(i=>i<x.o.length));
}
